<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ravi Kumar Dusi</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#0f172a;
      --card:#0b1224cc;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --primary:#2563eb;
      --secondary:#334155;
      --ring:#1d4ed8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, #1d4ed855, transparent 60%),
        radial-gradient(900px 500px at 20% 110%, #22c55e22, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 14px;
    }

    /* CSS-only “circuit” vibe (very light) */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        linear-gradient(transparent 31px, rgba(148,163,184,.08) 32px),
        linear-gradient(90deg, transparent 31px, rgba(148,163,184,.08) 32px);
      background-size:32px 32px;
      mask-image: radial-gradient(circle at 50% 35%, black 30%, transparent 70%);
      pointer-events:none;
    }

    .wrap{
      width:100%;
      max-width:520px;
      text-align:center;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(148,163,184,.18);
      border-radius:18px;
      padding:26px 18px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .avatar{
      width:88px; height:88px;
      border-radius:999px;
      margin:0 auto 14px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a);
      border: 2px solid rgba(255,255,255,.10);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .avatar img{
      width:100%; height:100%; object-fit:cover;
      display:block;
    }

    h1{
      font-size:30px;
      letter-spacing:.2px;
      margin:6px 0 6px;
    }

    .subtitle{
      margin:0 0 18px;
      color:var(--muted);
      font-size:15px;
      line-height:1.4;
    }

    .grid{
      display:grid;
      gap:12px;
      margin-top:10px;
    }

    a.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 14px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:600;
      letter-spacing:.2px;
      transition: transform .08s ease, filter .15s ease, background .15s ease;
      user-select:none;
    }
    a.btn:active{transform:scale(.99)}
    a.primary{background:var(--primary)}
    a.secondary{background:var(--secondary)}
    a.btn:hover{filter:brightness(1.06)}

    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .pill{
      flex:1;
      min-width:150px;
      background: rgba(148,163,184,.10);
      border:1px solid rgba(148,163,184,.18);
      padding:10px 12px;
      border-radius:999px;
      color:var(--muted);
      font-size:13px;
    }

    footer{
      margin-top:14px;
      color:rgba(148,163,184,.55);
      font-size:12px;
    }

    /* tiny icon style */
    .ico{width:18px; height:18px; display:inline-block}
    .ico svg{width:18px; height:18px; fill:currentColor}
  </style>
</head>

</body>
</html>

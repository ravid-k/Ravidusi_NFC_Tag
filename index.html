<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ravi Kumar Dusi</title>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#0f172a;
      --card:#0b1224cc;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --primary:#2563eb;
      --secondary:#334155;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      
      background:
        linear-gradient(180deg, rgba(11,16,32,.88), rgba(15,23,42,.88)),
        url("./circuit_img.png") center/cover no-repeat;

      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 14px;
    }

    .wrap{
      width:100%;
      max-width:520px;
      text-align:center;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(148,163,184,.18);
      border-radius:18px;
      padding:26px 18px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .avatar{
      width:96px;
      height:96px;
      border-radius:999px;
      margin:0 auto 14px;
      border: 2px solid rgba(255,255,255,.14);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a);
    }
    /* This ensures the face is centered */
    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      display:block;
    }
    .avatar .fallback{
      font-weight:800;
      font-size:26px;
      color:#e5e7eb;
    }

    h1{
      font-size:30px;
      letter-spacing:.2px;
      margin:6px 0 6px;
    }

    .subtitle{
      margin:0 0 18px;
      color:var(--muted);
      font-size:15px;
      line-height:1.4;
    }

    .grid{
      display:grid;
      gap:12px;
      margin-top:10px;
    }

    a.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 14px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:600;
      letter-spacing:.2px;
      transition: transform .08s ease, filter .15s ease, background .15s ease;
      user-select:none;
    }
    a.btn:active{transform:scale(.99)}
    a.primary{background:var(--primary)}
    a.secondary{background:var(--secondary)}
    a.btn:hover{filter:brightness(1.06)}

    .pill{
      margin-top:14px;
      display:inline-block;
      background: rgba(148,163,184,.10);
      border:1px solid rgba(148,163,184,.18);
      padding:10px 16px;
      border-radius:999px;
      color:var(--muted);
      font-size:13px;
    }

    footer{
      margin-top:12px;
      color:rgba(148,163,184,.55);
      font-size:12px;
    }

    .ico{width:18px; height:18px; display:inline-block}
    .ico svg{width:18px; height:18px; fill:currentColor}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <!-- Upload your image to repo and keep this filename exactly -->
      <div class="avatar">
        <img src="./Ravi_profile_pic1-min.jpg" alt="Ravi Kumar Dusi"
             onerror="this.remove(); document.querySelector('.fallback').style.display='block';">
        <span class="fallback" style="display:none;">RD</span>
      </div>

      <h1>Ravi Kumar Dusi</h1>
      <p class="subtitle">Electronics Engineer · +49 17620555698</p>

      <div class="grid">

        <!-- GitHub -->
        <a class="btn primary" href="https://github.com/ravid-k" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">

          </span>
          GitHub
        </a>

        <!-- LinkedIn with icon -->
        <a class="btn primary" href="https://www.linkedin.com/in/ravi-dusi-b74534148/" target="_blank" rel="noopener">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.05-1.86-3.05-1.86 0-2.14 1.45-2.14 2.95v5.67H9.33V9h3.42v1.56h.05c.48-.9 1.64-1.86 3.37-1.86 3.6 0 4.27 2.37 4.27 5.45v6.3zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>

        <!-- Resume -->
        <a class="btn Primary" href="./Ravi_CV_RES_compressed.pdf" target="_blank" rel="noopener">
          Resume (PDF)
        </a>

        <a class="btn secondary" href="https://wa.me/491783233921" target="_blank" rel="noopener">
          WhatsApp
        </a>

        <a class="btn secondary" href="tel:+4917620555698">
          Call Me
        </a>
      </div>

      <div class="pill">Ravi Dusi Portfolio</div>

      <footer>© <span id="y"></span> Ravi Kumar Dusi</footer>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>

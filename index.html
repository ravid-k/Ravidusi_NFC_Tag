<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ravi Kumar Dusi</title>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#0f172a;
      --card:#0b1224cc;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --primary:#2563eb;
      --secondary:#334155;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(180deg, rgba(11,16,32,.88), rgba(15,23,42,.88)),
        url("./circuit_img.png") center/cover no-repeat;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 14px;
    }

    .wrap{width:100%;max-width:520px;text-align:center;}

    .card{
      position:relative;
      background:var(--card);
      border:1px solid rgba(148,163,184,.18);
      border-radius:18px;
      padding:26px 18px 18px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
    }

    /* OPTION B – Floating About badge */
    .about-float{
      position:absolute;
      top:14px;
      right:14px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(37,99,235,.18);
      border:1px solid rgba(37,99,235,.35);
      color:white;
      text-decoration:none;
      font-size:13px;
      font-weight:700;
      transition:transform .15s ease, filter .2s ease;
      z-index:10;
    }
    .about-float:hover{
      filter:brightness(1.15);
      transform:translateY(-2px);
    }
    .about-float img{
      width:26px;
      height:26px;
      object-fit:contain;
      animation:bob 1.6s ease-in-out infinite;
    }

    @keyframes bob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-3px)}
    }

    .avatar{
      width:96px;height:96px;border-radius:999px;
      margin:8px auto 12px;
      border:2px solid rgba(255,255,255,.14);
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a);
    }
    .avatar img{
      width:100%;height:100%;
      object-fit:cover;object-position:center;
    }
    .fallback{font-size:26px;font-weight:800}

    h1{font-size:30px;margin:6px 0}
    .subtitle{
      color:var(--muted);
      font-size:15px;
      margin-bottom:14px;
    }

    .grid{display:grid;gap:12px}

    a.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:600;
      transition:transform .08s,filter .15s;
    }
    a.btn:hover{filter:brightness(1.06)}
    a.btn:active{transform:scale(.99)}
    .primary{background:var(--primary)}
    .secondary{background:var(--secondary)}

    .ico svg{width:18px;height:18px;fill:white}

    .pill{
      margin-top:14px;
      display:inline-block;
      background:rgba(148,163,184,.1);
      border:1px solid rgba(148,163,184,.18);
      padding:10px 16px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
    }

    footer{margin-top:12px;font-size:12px;color:rgba(148,163,184,.55)}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <!-- OPTION B Floating button -->
      <a class="about-float" href="./Ravi_presentation.pdf" target="_blank">
        <img src="./Presentation_icon.png" alt="">
        Hola! About me
      </a>

      <div class="avatar">
        <img src="./Ravi_profile_pic1-min.jpg"
             onerror="this.remove();this.nextElementSibling.style.display='block'">
        <span class="fallback" style="display:none">RD</span>
      </div>

      <h1>Ravi Kumar Dusi</h1>
      <p class="subtitle">Electronics Engineer · +49 17620555698</p>

      <div class="grid">
        <a class="btn primary" href="https://github.com/ravid-k" target="_blank">
          <span class="ico">
            <svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.5 5.86.5 12.47c0 5.24 3.44 9.68 8.2 11.25.6.12.82-.26.82-.58v-2.1c-3.34.74-4.04-1.66-4.04-1.66-.55-1.45-1.34-1.84-1.34-1.84-1.1-.78.08-.77.08-.77 1.22.09 1.86 1.28 1.86 1.28 1.08 1.9 2.83 1.35 3.52 1.03.11-.8.42-1.35.76-1.66-2.66-.32-5.46-1.36-5.46-6.06 0-1.34.46-2.44 1.22-3.3-.12-.32-.53-1.62.12-3.38 0 0 1-.33 3.3 1.26a11.05 11.05 0 0 1 6 0c2.3-1.59 3.3-1.26 3.3-1.26.65 1.76.24 3.06.12 3.38.76.86 1.22 1.96 1.22 3.3 0 4.71-2.8 5.74-5.48 6.05.43.38.82 1.12.82 2.26v3.35c0 .32.22.7.83.58 4.76-1.57 8.2-6.01 8.2-11.25C23.5 5.86 18.27.5 12 .5z"/></svg>
          </span>
          GitHub
        </a>

        <a class="btn primary" href="https://www.linkedin.com/in/ravi-dusi-b74534148/" target="_blank">
          LinkedIn
        </a>

        <a class="btn primary" href="./Ravi_presentation.pdf" target="_blank">
          Resume / CV (PDF)
        </a>

        <a class="btn secondary" href="https://wa.me/491783233921" target="_blank">
          WhatsApp
        </a>

        <a class="btn secondary" href="tel:+4917620555698">
          Call Me
        </a>
      </div>

      <div class="pill">Ravi Dusi Portfolio</div>
      <footer>© <span id="y"></span> Ravi Kumar Dusi</footer>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent=new Date().getFullYear();
  </script>
</body>
</html>
